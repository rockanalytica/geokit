[package]
name = "geokit-env"
version = "0.3.0"
description = "The Environment manager and the GPU Lease an app's desktop core shares: the Pythons it may start, the steps that install its own, and the one right to the GPU"
authors = ["RockAnalytica"]
license = "Apache-2.0"
repository = "https://github.com/rockanalytica/geokit"
edition = "2021"
rust-version = "1.80"
publish = false

[dependencies]
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[target."cfg(unix)".dependencies]
libc = "0.2"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Security"] }
